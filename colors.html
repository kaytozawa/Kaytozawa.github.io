<!DOCTYPE html>
<html>
<head>
<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ffffff;
}

.palette {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  min-height: 100vh;
}

.swatch {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 30px 10px;
  text-align: center;
}

</style>
</head>

<body>

<div class="palette">

  <div class="swatch" style="background:#F3F7F7;">
    Pearl<br>#F3F7F7
  </div>

  <div class="swatch" style="background:#EAF3F3;">
    Mist Blue<br>#EAF3F3
  </div>

  <div class="swatch" style="background:#DDECEC;">
    Soft Aqua<br>#DDECEC
  </div>

  <div class="swatch" style="background:#FFFFFF;">
    White<br>#FFFFFF
  </div>

  <div class="swatch" style="background:#243030; color:white;">
    Charcoal<br>#243030
  </div>

  <div class="swatch" style="background:#5FAFAD; color:white;">
    Turquoise<br>#5FAFAD
  </div>

  <div class="swatch" style="background:#1F2929; color:white;">
    Deep Charcoal<br>#1F2929
  </div>

</div>

</body>
</html>
